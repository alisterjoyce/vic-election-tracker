# Netlify is no longer the primary host: the site is published to GitHub Pages
# (https://alisterjoyce.github.io/vic-election-tracker/) by .github/workflows/deploy.yml and refresh.yml.
# This file is kept so the site can still be deployed to Netlify (publish site/, no build).
[build]
  publish = "site"
  command = ""

# Data files change daily; let browsers and the CDN revalidate them quickly.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Candidate photos change rarely; cache them for a day.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
