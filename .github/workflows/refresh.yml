name: Refresh data

on:
  schedule:
    # Four full refreshes a day: 6 am, 10 am, 4 pm and 8 pm Melbourne time (AEDT, UTC+11).
    # When daylight saving ends (5 Apr 2027) these run an hour earlier in Melbourne.
    - cron: "0 19,23,5,9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write      # deploy job: publish to GitHub Pages
  id-token: write   # deploy job: authenticate the Pages deployment

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ABC pages (~3 min) and news searches (~5 min) at one request a second
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run refresh script
        run: python scripts/refresh.py

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Refresh times and source status change on every run; commit only when the data itself did.
          if [ "$(python scripts/data_changed.py)" = "unchanged" ]; then
            echo "No data changes (only refresh times and source status)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add site/data
          git commit -m "Refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Publish the refreshed site to GitHub Pages. The refresh job pushes with GITHUB_TOKEN, which
  # doesn't trigger deploy.yml, so this job deploys the new data itself (only when it changed).
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the tip of main, including the data commit the refresh job just pushed

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
