name: Refresh data

on:
  schedule:
    # 20:00 UTC = 7am AEDT / 6am AEST in Melbourne
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write      # deploy job: publish to GitHub Pages
  id-token: write   # deploy job: authenticate the Pages deployment

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ABC pages (~3 min) and news searches (~5 min) at one request a second
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run refresh script
        run: python scripts/refresh.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  # Publish the refreshed site to GitHub Pages. The refresh job pushes with GITHUB_TOKEN, which
  # doesn't trigger deploy.yml, so this job deploys the new data itself.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the tip of main, including the data commit the refresh job just pushed

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
