name: Refresh data

on:
  schedule:
    # Four full refreshes a day: 6 am, 10 am, 4 pm and 8 pm Melbourne time (AEDT, UTC+11).
    # When daylight saving ends (5 Apr 2027) these run an hour earlier in Melbourne.
    - cron: "0 19,23,5,9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write      # deploy job: publish to GitHub Pages
  id-token: write   # deploy job: authenticate the Pages deployment

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ABC pages (~3 min), news searches (~5 min) and the how-to-vote register (~2 min, plus a few seconds per new card) at one request a second; Chromium install (~1 min)
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run refresh script
        run: python scripts/refresh.py

      # The weekly briefing card (share/this-week.png), drawn by the site's own sharecard.js in headless Chromium.
      # Best effort: if Chromium can't be installed or the card can't be drawn, the last image is kept.
      - name: Install Chromium for the share image
        id: chromium
        continue-on-error: true
        run: |
          pip install "playwright==1.64.1"
          python -m playwright install --with-deps chromium

      - name: Draw the this-week image
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_share.py

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Refresh times and source status change on every run; commit only when the data itself did.
          if [ "$(python scripts/data_changed.py)" = "unchanged" ]; then
            echo "No data changes (only refresh times and source status)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add site/data site/share
          git commit -m "Refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          # A run takes ~11 minutes, so main often moves meanwhile (23 Nov 2026: a code push made one run's push
          # fail with "fetch first"). Then rebase the data commit onto the new main and push again, up to 3 times.
          # If the rebase conflicts (someone changed the same data by hand), push nothing: their commit wins and
          # the next refresh redoes this run's data on top of it.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=Refresh push::main moved during the refresh; rebasing the data commit onto it (attempt $attempt of 3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::warning title=Refresh not pushed::This run's data conflicts with a commit pushed to main while it ran, so nothing was pushed; the next refresh will redo it."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error title=Refresh not pushed::The data commit could not be pushed after 3 rebases."
          exit 1

  # Publish the refreshed site to GitHub Pages. The refresh job pushes with GITHUB_TOKEN, which
  # doesn't trigger deploy.yml, so this job deploys the new data itself (only when it changed).
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20   # up to 3 deploy attempts, 60 s apart
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the tip of main, including the data commit the refresh job just pushed

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages sometimes can't see the artifact uploaded a moment before ("No artifacts named github-pages",
      # 20 Nov 2026; GitHub reported no incident). Try up to 3 times, 60 s apart, in this job (a re-run of the job
      # uploads a second artifact and fails on "Multiple artifacts"); the last try fails the run if it fails too.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait 60 s before deploy attempt 2
        if: steps.deployment.outcome == 'failure'
        run: echo "::warning::Pages deploy attempt 1 failed; trying again in 60 s" && sleep 60

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait 60 s before deploy attempt 3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: echo "::warning::Pages deploy attempt 2 failed; trying once more in 60 s" && sleep 60

      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report a failed deploy
        if: failure()
        run: echo "::error title=Pages deploy::The site was not deployed after 3 attempts; run deploy.yml by hand (workflow_dispatch)."
